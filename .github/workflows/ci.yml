name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-docs-lint.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  readme-examples:
    # Every ```rust block in README.md compiles against this crate.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-readme-examples.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  cargo-deny:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-deny.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  cargo-vet:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-vet.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  cargo-machete:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-machete.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  reuse-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-reuse.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  docs-strict:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-rustdoc-strict.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  verify-signatures:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-verify-signatures.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
  test-matrix:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-test-matrix.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be

  # ── A+ rigor parity with the core ──────────────────────────────────
  # No coverage-gate job: this crate's entire source is one
  # `pub use noyalib::compat::serde_yaml::*;` — zero coverable
  # functions, so llvm-cov reports an empty TOTAL and any threshold
  # arithmetic is vacuous. The behaviour behind the re-export is
  # held to the core repository's 95/94/93 coverage gate and its
  # 18-case serde_yaml contract suite; this repo's test-matrix runs
  # the drop-in integration tests on every platform instead.
  msrv-core:
    # Verifies the declared 1.86.0 floor actually builds.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-msrv-core.yml@a1a2c8e4e48106dd099bc47e52680a9775d852be
    with:
      toolchain: "1.86.0"

  fuzz-regression:
    # Every fuzz target builds on every push, and the seed corpus (plus
    # any fixed-bug regression inputs under fuzz/regressions/<target>/)
    # is replayed with -runs=0, so a fixed finding stays fixed.
    name: fuzz-regression
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-fuzz"
          key: fuzz-regression
      - run: cargo install --locked cargo-fuzz
      - name: Build every fuzz target
        run: cargo +nightly fuzz build
      - name: Replay seed corpus and fixed-bug regressions
        run: |
          set -euo pipefail
          cd fuzz
          for f in fuzz_targets/*.rs; do
            t=$(basename "$f" .rs)
            dirs=(corpus/seed)
            [ -d "regressions/$t" ] && dirs+=("regressions/$t")
            echo "── replaying $t against: ${dirs[*]}"
            cargo +nightly fuzz run "$t" "${dirs[@]}" -- -runs=0
          done
