name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-docs-lint.yml@7eab99a87e0a24e34990a93a7ef988b29ee54628
  cargo-deny:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-deny.yml@05d8856df421bfdec5f96c61f9b76700655fe7b1
  cargo-vet:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-vet.yml@05d8856df421bfdec5f96c61f9b76700655fe7b1
  cargo-machete:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-machete.yml@bbf0b9ca4930398a4984c78deccb91002c15d13b
  reuse-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-reuse.yml@bbf0b9ca4930398a4984c78deccb91002c15d13b
  docs-strict:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-rustdoc-strict.yml@499d114d74b685b7c987c3ea104b5fd00bb5c5f3
  verify-signatures:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-verify-signatures.yml@bbf0b9ca4930398a4984c78deccb91002c15d13b
  test-matrix:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-test-matrix.yml@05d8856df421bfdec5f96c61f9b76700655fe7b1

  # ── A+ rigor parity with the core ──────────────────────────────────
  # No coverage-gate job: this crate's entire source is one
  # `pub use noyalib::compat::serde_yaml::*;` — zero coverable
  # functions, so llvm-cov reports an empty TOTAL and any threshold
  # arithmetic is vacuous. The behaviour behind the re-export is
  # held to the core repository's 95/94/93 coverage gate and its
  # 18-case serde_yaml contract suite; this repo's test-matrix runs
  # the drop-in integration tests on every platform instead.
  msrv-core:
    # Verifies the declared 1.86.0 floor actually builds.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-msrv-core.yml@499d114d74b685b7c987c3ea104b5fd00bb5c5f3
    with:
      toolchain: "1.86.0"
