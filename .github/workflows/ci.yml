name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-deny.yml@ae86a20b764905c8332652b28d8989f7ddde0376
  cargo-vet:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-vet.yml@ae86a20b764905c8332652b28d8989f7ddde0376
  cargo-machete:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-machete.yml@ae86a20b764905c8332652b28d8989f7ddde0376
  reuse-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-reuse.yml@ae86a20b764905c8332652b28d8989f7ddde0376
  docs-strict:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-rustdoc-strict.yml@0a0c75faefdd2e1ba5ea06d4fe9b372154a99a6e
  verify-signatures:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-verify-signatures.yml@ae86a20b764905c8332652b28d8989f7ddde0376
  test-matrix:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-test-matrix.yml@ae86a20b764905c8332652b28d8989f7ddde0376

  # ── A+ rigor parity with the core ──────────────────────────────────
  # No coverage-gate job: this crate's entire source is one
  # `pub use noyalib::compat::serde_yaml::*;` — zero coverable
  # functions, so llvm-cov reports an empty TOTAL and any threshold
  # arithmetic is vacuous. The behaviour behind the re-export is
  # held to the core repository's 95/94/93 coverage gate and its
  # 18-case serde_yaml contract suite; this repo's test-matrix runs
  # the drop-in integration tests on every platform instead.
  msrv-core:
    # Verifies the declared 1.86.0 floor actually builds.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-msrv-core.yml@0a0c75faefdd2e1ba5ea06d4fe9b372154a99a6e
    with:
      toolchain: "1.86.0"
