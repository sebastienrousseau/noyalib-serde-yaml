[package]
name = "noyalib-serde-yaml"
version = "0.0.29"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
description = "Drop-in serde_yaml replacement backed by noyalib — rename the package in Cargo.toml, change zero source lines"
repository = "https://github.com/sebastienrousseau/noyalib-serde-yaml"
homepage = "https://github.com/sebastienrousseau/noyalib"
documentation = "https://docs.rs/noyalib-serde-yaml"
readme = "README.md"
keywords = ["yaml", "serde", "serde-yaml", "migration", "compat"]
categories = ["encoding", "parser-implementations", "config"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

[dependencies]
# Strict lockstep with the core, per ADR-0005: this crate releases at
# the same `=0.0.X` as noyalib and pins it exactly.
noyalib = { version = "=0.0.29", default-features = false, features = [
    "std",
    "compat-serde-yaml",
] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = "0.8"

[[bench]]
name = "shim_overhead"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# ── Pre-release resolution ─────────────────────────────────────────
# The `=0.0.29` lockstep pin resolves only against the *published*
# core. Until that release lands on crates.io, resolve it from the
# core's release branch so CI and local builds work. Cargo strips
# `[patch]` from published manifests, and the release validation
# (scripts/verify-release-versions.sh) refuses to tag while this
# section is present — REMOVE IT as part of cutting v0.0.29.
[patch.crates-io]
noyalib = { git = "https://github.com/sebastienrousseau/noyalib", branch = "feat/v0.0.29" }
