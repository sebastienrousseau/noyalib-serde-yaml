[package]
name = "noyalib-serde-yaml"
version = "0.0.29"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
description = "Drop-in serde_yaml replacement backed by noyalib — rename the package in Cargo.toml, change zero source lines"
repository = "https://github.com/sebastienrousseau/noyalib-serde-yaml"
homepage = "https://github.com/sebastienrousseau/noyalib"
documentation = "https://docs.rs/noyalib-serde-yaml"
readme = "README.md"
keywords = ["yaml", "serde", "serde-yaml", "migration", "compat"]
categories = ["encoding", "parser-implementations", "config"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

[dependencies]
# Strict lockstep with the core, per ADR-0005: this crate releases at
# the same `=0.0.X` as noyalib and pins it exactly.
noyalib = { version = "=0.0.29", default-features = false, features = [
    "std",
    "compat-serde-yaml",
] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
