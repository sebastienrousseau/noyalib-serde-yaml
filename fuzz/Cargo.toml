[package]
name = "noyalib-serde-yaml-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The shim, exactly as a renamed dependency sees it.
[dependencies.serde_yaml]
package = "noyalib-serde-yaml"
path = ".."

[[bin]]
name = "fuzz_from_str"
path = "fuzz_targets/fuzz_from_str.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false
